# Project Americas settings. Copy to C:\Project Americas\americas.ini (or %AMERICAS_ROOT%\americas.ini),
# or run: .\scripts\setup.ps1 -GameDir <folder>

# The folder with the unpacked game (MicrosoftGame.Config, the executable, the archives).
# It is only ever read, never written.
game_dir = D:\Games\unpacked-game

# The console the game believes it runs on: auto, series_s or series_x. It sets the game's memory
# budget (Series X 13.5 GiB, Series S about 7.6 GiB). auto picks Series X on hosts with 24 GB of
# RAM or more, Series S otherwise. --console on the command line overrides it.
# console = auto
